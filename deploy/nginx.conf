# qujt-blog Nginx 站点配置（HTTP，大陆服务器需备案后再绑定域名）
server {
    listen 80 default_server;
    server_name _;
    root /opt/qujt-blog/current/apps/web/dist;
    index index.html;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    client_max_body_size 10m;

    # API 反代
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 管理后台 SPA
    location /admin {
        alias /opt/qujt-blog/current/apps/admin/dist;
        try_files $uri $uri/ /admin/index.html;
    }

    # 前台 SPA（含静态资源 /assets/）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ========== 测试环境（同机隔离：测试 API 3001 + 独立测试库 data/test.db） ==========
    # 测试 API 反代：/test/api/** -> 127.0.0.1:3001/api/**
    location /test/api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # 测试管理后台 SPA
    location /test/admin {
        alias /opt/qujt-blog/apps/test-admin/dist;
        try_files $uri $uri/ /test/admin/index.html;
    }
    # 测试前台 SPA
    location /test/ {
        alias /opt/qujt-blog/apps/test-web/dist/;
        try_files $uri $uri/ /test/index.html;
    }
    # 访问 /test 时跳转到 /test/（保证 alias 子路径生效）
    location = /test { return 301 /test/; }
}
